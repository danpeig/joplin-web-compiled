name: Build Joplin Web release zip

on:
  # Joplin's repository can't trigger this one, so poll for new tags instead.
  # Scheduled runs only build when there is no release for the newest tag yet.
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Joplin version or ref to build, e.g. 3.7.21, v3.7.21 or a branch such as release-3.7. Leave empty for the latest stable vX.Y.Z tag.'
        required: false
        default: ''
      publish_release:
        description: 'Also publish the zip as a GitHub Release in this repository'
        type: boolean
        default: true

# contents: write is only needed to create the GitHub Release
permissions:
  contents: write

env:
  JOPLIN_REPO: laurent22/joplin

jobs:
  check:
    # Decides whether a build is needed. Manual runs always build.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "schedule" ]]; then
            echo "Manual run: building (version input: '${INPUT_VERSION:-latest}')"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST="$(git ls-remote --tags --refs "https://github.com/$JOPLIN_REPO.git" 'v*' \
            | sed 's;.*refs/tags/;;' \
            | grep -P '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort --version-sort \
            | tail -n1)"
          if [[ -z "$LATEST" ]]; then
            echo "::error::No stable vX.Y.Z tags found in $JOPLIN_REPO"
            exit 2
          fi

          echo "Latest Joplin tag: $LATEST"
          if gh release view "web-$LATEST" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release web-$LATEST already exists, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $LATEST yet, building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # Don't cancel a build that is already running when a scheduled run starts
    concurrency:
      group: joplin-web-build
      cancel-in-progress: false
    steps:
      - name: Resolve Joplin ref
        id: resolve
        env:
          INPUT_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          REQUESTED="$(echo "$INPUT_VERSION" | xargs)"   # trim whitespace

          if [[ -z "$REQUESTED" ]]; then
            # Latest stable tag: vX.Y.Z only (no betas, no android-/ios-/server- prefixes)
            REF="$(git ls-remote --tags --refs "https://github.com/$JOPLIN_REPO.git" 'v*' \
              | sed 's;.*refs/tags/;;' \
              | grep -P '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort --version-sort \
              | tail -n1)"
            if [[ -z "$REF" ]]; then
              echo "::error::No stable vX.Y.Z tags found in $JOPLIN_REPO"
              exit 2
            fi
            KIND=tag
          elif [[ "$REQUESTED" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            REF="v${REQUESTED#v}"
            KIND=tag
          else
            REF="$REQUESTED"
            KIND=other
          fi

          # Fail early with a clear message if the ref doesn't exist
          if [[ "$KIND" = "tag" ]]; then
            git ls-remote --exit-code --tags --refs "https://github.com/$JOPLIN_REPO.git" "refs/tags/$REF" >/dev/null \
              || { echo "::error::Tag $REF not found in $JOPLIN_REPO"; exit 2; }
          else
            git ls-remote --exit-code "https://github.com/$JOPLIN_REPO.git" "$REF" "refs/heads/$REF" "refs/tags/$REF" >/dev/null \
              || { echo "::error::Ref $REF not found in $JOPLIN_REPO"; exit 2; }
          fi

          echo "Building Joplin ref: $REF ($KIND)"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Checkout Joplin source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.JOPLIN_REPO }}
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Compute names
        id: names
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          KIND: ${{ steps.resolve.outputs.kind }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          if [[ "$KIND" = "tag" ]]; then
            LABEL="${REF#v}"                         # 3.7.21
            RELEASE_TAG="web-v$LABEL"
          else
            LABEL="${REF//\//-}-$SHA"                # release-3.7-abc1234
            RELEASE_TAG="web-$LABEL"
          fi
          echo "Label: $LABEL (commit $SHA)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "zip=joplin-web-$LABEL.zip" >> "$GITHUB_OUTPUT"

      - name: Prepare yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build web app
        run: cd packages/app-mobile/ && yarn web

      - name: Create release zip
        run: |
          DIST=packages/app-mobile/web/dist
          test -f "$DIST/index.html" || { echo "Build output missing index.html"; exit 1; }
          # Zip the contents (not the folder) so it extracts straight into the web root
          (cd "$DIST" && zip -r -9 -q "$GITHUB_WORKSPACE/${{ steps.names.outputs.zip }}" .)
          sha256sum "${{ steps.names.outputs.zip }}" > "${{ steps.names.outputs.zip }}.sha256"
          ls -lh "${{ steps.names.outputs.zip }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-web-${{ steps.names.outputs.label }}
          path: |
            ${{ steps.names.outputs.zip }}
            ${{ steps.names.outputs.zip }}.sha256
          # Already compressed, don't zip it twice
          compression-level: 0

      - name: Publish GitHub Release
        # inputs.* is empty on scheduled runs, so publish there explicitly
        if: ${{ github.event_name == 'schedule' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.names.outputs.release_tag }}
          ZIP: ${{ steps.names.outputs.zip }}
          LABEL: ${{ steps.names.outputs.label }}
          REF: ${{ steps.resolve.outputs.ref }}
          SHA: ${{ steps.names.outputs.sha }}
        run: |
          NOTES="Joplin Web $LABEL, built from $JOPLIN_REPO at \`$REF\` (commit $SHA).

          Extract the zip into the document root of any static web server (HTTPS required for the service worker/PWA, except on localhost)."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists, replacing assets"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$ZIP" "$ZIP.sha256"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Joplin Web $LABEL" \
              --notes "$NOTES" \
              "$ZIP" "$ZIP.sha256"
          fi
